[package]
name = "pocket-cardputer-zero"
edition = "2021"
description = "PocketJS program for the M5Stack CardputerZero: its panel, its keyboard, its sensors and camera, and a worker whose HTTP reaches this machine"

version.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
pocket-runtime = { workspace = true, default-features = true }
pocket-drivers = { workspace = true, default-features = true }
pocket-raster = { workspace = true, default-features = true }
pocket-package = { workspace = true, default-features = true }
pocket-spec = { workspace = true, default-features = true }
pocketjs-core = { workspace = true, default-features = true }
pocket-guest-rquickjs = { workspace = true, default-features = true }
pocket-linux-hooks = { workspace = true, default-features = true }
pocket-linux-fbdev = { workspace = true, default-features = true }
pocket-linux-evdev = { workspace = true, default-features = true }
rquickjs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
percent-encoding = "2.3"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
rustls-native-certs = "0.8"
webpki-roots = "0.26"
qrcode = { version = "0.14", default-features = false }
libc = "0.2.191"
zune-jpeg = "0.5"
rqrr = { version = "0.11", default-features = false }

[build-dependencies]
pocket-profile-build.workspace = true
cc = "1"
serde_json = { workspace = true }
